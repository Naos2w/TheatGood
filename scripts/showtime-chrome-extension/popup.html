<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TheatGood 秀泰研究</title>
    <style>
      body {
        font:
          14px/1.6 'Microsoft JhengHei',
          sans-serif;
        background: #f5f5f7;
        color: #222;
        width: 310px;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 9px;
      }
      p {
        margin: 0 0 10px;
        font-size: 12px;
        color: #555;
      }
      select,
      button {
        display: block;
        width: 100%;
        font: inherit;
        padding: 9px;
        border-radius: 8px;
        box-sizing: border-box;
      }
      select {
        border: 1px solid #bbb;
        background: #fff;
        margin-bottom: 12px;
      }
      button {
        color: #fff;
        background: #5b39a9;
        border: 0;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        background: #b6b0c4;
        cursor: default;
      }
      #status {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        margin-top: 12px;
        background: #fff;
        border-radius: 7px;
        padding: 10px;
        min-height: 35px;
      }
      small {
        display: block;
        color: #666;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>TheatGood · 秀泰資料研究 <span id="version"></span></h1>
    <p>
      直接使用此 Chrome
      已登入的秀泰分頁，不會另開分頁，也不會執行桌面視窗切換指令。蒐集期間該秀泰分頁會自動切換電影資訊；請先使用其他程式，不要同時操作這個分頁。
    </p>
    <label for="venue">分館</label>
    <select id="venue"></select>
    <button id="run">讀取這間影城的座位預覽</button>
    <div id="status" role="status" aria-live="polite">
      等待開始。每輪最多檢查 3 部電影、每部 4 種廳別。
    </div>
    <small
      >完成後資料只會儲存至本機 Downloads/TheatGood。若遇 Cloudflare
      或未登入，會停止、不繞過驗證。安裝擴充功能需你自行在 Chrome 核准。</small
    >
    <script src="popup.js"></script>
  </body>
</html>
